name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Check generated shared code
        if: hashFiles('scripts/sync-shared.mjs') != ''
        run: pnpm sync-shared && git diff --exit-code supabase/functions/_shared
      - run: pnpm --filter mobile web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-export
          path: apps/mobile/dist
          retention-days: 7
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: hashFiles('supabase/functions/**/*.test.ts') != ''
        with:
          deno-version: v2.x
      - name: Test Edge Functions
        if: hashFiles('supabase/functions/**/*.test.ts') != ''
        run: deno test --allow-all --permit-no-files --ignore=supabase/functions/_shared,'supabase/functions/**/*.integration.test.ts' supabase/functions/
