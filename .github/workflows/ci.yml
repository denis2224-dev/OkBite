name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter mobile web
      - uses: actions/upload-artifact@v4
        with:
          name: web-export
          path: apps/mobile/dist
          retention-days: 7
      - uses: denoland/setup-deno@v2
        if: hashFiles('supabase/functions/**/*.test.ts') != ''
        with:
          deno-version: v2.x
      - name: Test Edge Functions
        if: hashFiles('supabase/functions/**/*.test.ts') != ''
        run: deno test --allow-all --ignore=supabase/functions/_shared supabase/functions/
