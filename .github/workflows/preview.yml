name: EAS PR preview

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fork-notice:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Explain unavailable fork preview
        run: |
          message='EAS previews are unavailable for fork pull requests because Expo credentials are not shared with forks.'
          echo "::notice::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
    steps:
      - name: Check preview setup
        id: setup
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ] && [ -n "$EXPO_PUBLIC_EAS_PROJECT_ID" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'EAS preview setup is pending: configure EXPO_TOKEN and EXPO_PUBLIC_EAS_PROJECT_ID. See .github/SETUP.md.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.setup.outputs.enabled == 'true'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.setup.outputs.enabled == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.setup.outputs.enabled == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.setup.outputs.enabled == 'true'
      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        if: steps.setup.outputs.enabled == 'true'
        with:
          eas-version: 27.x
          packager: pnpm
          token: ${{ secrets.EXPO_TOKEN }}
      - uses: expo/expo-github-action/preview@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        if: steps.setup.outputs.enabled == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        with:
          working-directory: apps/mobile
          command: eas update --auto --branch pr-${{ github.event.number }} --environment preview --non-interactive
