# Stable team defaults. Use a separate configuration for parallel local stacks.
project_id = "okbite"
[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
[db]
port = 54322
shadow_port = 54320
major_version = 15
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
port = 54323
[inbucket]
port = 54324
[analytics]
enabled = false

[functions.lookup]
verify_jwt = false

[functions.add-product]
verify_jwt = false

[functions.report]
verify_jwt = false

[functions.identify]
verify_jwt = false

[functions.client-error]
verify_jwt = false

# Auth and moderator membership are checked by the handler via Auth.getUser.
[functions.moderate]
verify_jwt = false

# Local C7 browser callback. Hosted allowlists are configured separately.
[auth]
site_url = "http://localhost:8081"
additional_redirect_urls = ["http://localhost:8081/admin", "okbite://admin"]
